name: Build RenPy Game

on:
  push:
  workflow_dispatch:


jobs:
  build:

    runs-on: ubuntu-latest

    steps:


    # =====================
    # Checkout
    # =====================
    - name: Checkout
      uses: actions/checkout@v4



    # =====================
    # Java
    # =====================
    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "temurin"



    # =====================
    # Dependencies
    # =====================
    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          ant \
          unzip \
          wget



    # =====================
    # Android SDK
    # =====================
    - name: Setup Android SDK
      run: |

        export ANDROID_HOME=$HOME/android-sdk

        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV


        mkdir -p $ANDROID_HOME/cmdline-tools


        wget -q \
        https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
        -O sdk.zip


        unzip -q sdk.zip \
        -d $ANDROID_HOME/cmdline-tools


        mv \
        $ANDROID_HOME/cmdline-tools/cmdline-tools \
        $ANDROID_HOME/cmdline-tools/latest


        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH


        yes | sdkmanager --licenses || true


        sdkmanager \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"




    # =====================
    # Find RenPy Game
    # =====================
    - name: Detect Game Directory
      run: |

        set -e


        if [ -f "$GITHUB_WORKSPACE/game/options.rpy" ]; then

          GAME_DIR="$GITHUB_WORKSPACE"


        elif [ -f "$GITHUB_WORKSPACE/mygame/game/options.rpy" ]; then

          GAME_DIR="$GITHUB_WORKSPACE/mygame"


        else

          echo "Cannot find RenPy game!"

          find "$GITHUB_WORKSPACE" \
          -name options.rpy

          exit 1

        fi


        echo "GAME_DIR=$GAME_DIR" >> $GITHUB_ENV


        echo "Game directory:"
        echo "$GAME_DIR"


        echo "Game size:"
        du -sh "$GAME_DIR"




    # =====================
    # Download RenPy
    # =====================
    - name: Download RenPy 8.5.3
      run: |


        wget -q \
        https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2


        tar -xjf \
        renpy-8.5.3-sdk.tar.bz2



        wget -q \
        https://www.renpy.org/dl/8.5.3/renpy-8.5.3-rapt.zip



        unzip -q \
        renpy-8.5.3-rapt.zip \
        -d renpy-8.5.3-sdk/




    # =====================
    # Android Configure
    # =====================
    - name: Configure Android
      run: |


        echo "$ANDROID_HOME" \
        > renpy-8.5.3-sdk/rapt/sdk.txt



        cd "$GAME_DIR"



        keytool -genkeypair \
          -v \
          -keystore android.keystore \
          -alias android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 20000 \
          -storepass android \
          -keypass android \
          -dname "CN=RenPy Game,O=RenPy,C=US"



        cat > android.json << 'EOF'
{
    "package": "com.minc.game",
    "name": "民中",
    "icon_name": "民中",
    "version": "1.0",
    "numeric_version": 1,
    "orientation": "sensorLandscape",
    "permissions": [
        "INTERNET"
    ],
    "store": "none",
    "update_icons": true,
    "update_always": false,
    "heap_size": "4"
}
EOF



        echo "Android config:"
        cat android.json




    # =====================
    # Build PC
    # =====================
    - name: Build PC Package
      run: |


        cd renpy-8.5.3-sdk


        ./renpy.sh launcher distribute \
        "$GAME_DIR" \
        --package pc




    # =====================
    # Build APK
    # =====================
    - name: Build Android APK
      run: |


        cd renpy-8.5.3-sdk


        ./renpy.sh launcher android_build \
        "$GAME_DIR" \
        --destination "$GAME_DIR/bin"




    # =====================
    # Check Result
    # =====================
    - name: Check APK
      run: |


        echo "APK:"


        find "$GAME_DIR/bin" \
        -name "*.apk" \
        -type f \
        -exec ls -lh {} \;




    # =====================
    # Upload APK
    # =====================
    - name: Upload APK
      uses: actions/upload-artifact@v4

      with:

        name: mygame-apk

        path: |
          **/bin/*.apk




    # =====================
    # Upload PC
    # =====================
    - name: Upload PC
      uses: actions/upload-artifact@v4

      with:

        name: mygame-pc

        path: |
          **/dist/*.zip
