name: Build RenPy Android

on:
  push:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Java
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin



    - name: Install tools
      run: |
        sudo apt update
        sudo apt install -y ant unzip wget



    - name: Android SDK
      run: |

        mkdir -p $HOME/android-sdk/cmdline-tools

        wget -q \
        https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
        -O sdk.zip


        unzip -q sdk.zip \
        -d $HOME/android-sdk/cmdline-tools


        mv \
        $HOME/android-sdk/cmdline-tools/cmdline-tools \
        $HOME/android-sdk/cmdline-tools/latest


        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV


        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH


        yes | sdkmanager --licenses || true


        sdkmanager \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"




    - name: Find Game
      run: |

        if [ -f "game/options.rpy" ]; then

          echo "GAME_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV


        elif [ -f "mygame/game/options.rpy" ]; then

          echo "GAME_DIR=$GITHUB_WORKSPACE/mygame" >> $GITHUB_ENV


        else

          echo "RenPy game not found"
          exit 1

        fi




    - name: Download RenPy

      run: |

        wget -q \
        https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2


        tar -xjf renpy-8.5.3-sdk.tar.bz2



        wget -q \
        https://www.renpy.org/dl/8.5.3/renpy-8.5.3-rapt.zip


        unzip -q \
        renpy-8.5.3-rapt.zip \
        -d renpy-8.5.3-sdk/





    - name: Configure Android

      run: |

        cd renpy-8.5.3-sdk


        ./renpy.sh launcher android_configure




    - name: Build PC

      run: |

        cd renpy-8.5.3-sdk


        ./renpy.sh launcher distribute \
        "$GAME_DIR" \
        --package pc




    - name: Build APK

      run: |

        cd renpy-8.5.3-sdk


        ./renpy.sh launcher android_build \
        "$GAME_DIR"




    - name: Find APK

      run: |

        find . -name "*.apk"




    - name: Upload APK

      uses: actions/upload-artifact@v4

      with:

        name: RenPy-APK

        path: |
          **/*.apk




    - name: Upload PC

      uses: actions/upload-artifact@v4

      with:

        name: RenPy-PC

        path: |
          **/*.zip
